name: 10 - Execution flow

on: 
    workflow_dispatch:
        inputs:
            pass-unit-tests:
                type: boolean
                description: whether unit tests will pass or not
                default: true

jobs:
    lint-build:
        runs-on: ubuntu-latest
        steps:
            - name: Lint and build
              run: echo "Linting and building project" 
    unit-test:
        runs-on: ubuntu-latest
        steps:
            - name: running unit tests
              run: echo "Running tests...."
            - name: Failing tests
              if: ${{!inputs.pass-unit-tests}}
              run: exit 1
    deploy-nonprod:
        runs-on: ubuntu-latest
        needs: 
            - lint-build
            - unit-test
        steps:
            - name: Deploying on nonprod
              run: echo "Deploying on nonprod..."
    e2e-tests:
        runs-on: ubuntu-latest
        needs: 
            - deploy-nonprod
        steps:
            - name: Running E2E tests
              run: echo "Reunning E2E tests"
    load-test:
        runs-on: ubuntu-latest
        needs: 
            - deploy-nonprod
        steps:
            - name: Running load tests
              run: echo "Reunning load tests"
    deploy-prod:
        runs-on: ubuntu-latest
        needs: 
            - e2e-tests
            - load-test
        steps:
            - name: Deploying on Prod
              run: echo "Deploying on prod"