name: 16 - Environments

on:
    workflow_dispatch:

jobs:
    deploy-staging:
        runs-on: ubuntu-latest
        environment: staging
        env: 
            my-env-value: ${{ vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo vars
              run: |
                echo "Deploying on staging"
    e2e-tests:
         runs-on: ubuntu-latest
         needs: deploy-staging
         steps: 
            - name: E2E tests
              run: echo "Running E2E"
    deploy-prod:
        runs-on: ubuntu-latest
        needs: e2e-tests
        environment: prod
        env: 
            my-env-value: ${{ vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo vars
              run: |
                echo "Deploying on production"
    deploy-prod-frontend:
        runs-on: ubuntu-latest
        needs: e2e-tests
        environment: prod
        env: 
            my-env-value: ${{ vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo vars
              run: |
                echo "Deploying on production frontend"
    deploy-prod-backend1:
        runs-on: ubuntu-latest
        needs: e2e-tests
        environment: prod
        env: 
            my-env-value: ${{ vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo vars
              run: |
                echo "Deploying on production backend1"
    deploy-prod-backend2:
        runs-on: ubuntu-latest
        needs: e2e-tests
        environment: prod
        env: 
            my-env-value: ${{ vars.MY_ENV_VALUE || 'default value'}}
        steps:
            - name: Echo vars
              run: |
                echo "Deploying on production backend2"