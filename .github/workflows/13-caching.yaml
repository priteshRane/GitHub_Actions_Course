name: 13 - Caching

on: 
    workflow_dispatch:
        inputs:
            use-cache:
                description: Whether to exectute cache setup
                type: boolean
                default: true
jobs:
    build: 
        runs-on: ubuntu-latest
        defaults: 
            run: 
                working-directory: 04-using-actions/react-app
        steps: 
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                node-version: "20.x"
            - name: Install dependencies
              run: npm ci
            - name: Testing
              run: npm run test
            - name: Building
              run: npm run build
            - name: Deploying to nonprod
              run: echo "Deploying to nonprod"
        # 1. Checkout the code
        # 2. Install dependencies
        # 3. Unit Testing and Building
        # 4. Deploy to a nonprod environment
