name: Cache Node and NPM Dependencies
description: This action allow us to cache both Node and NPM dependencies based on the package-lock.json file

inputs:
  node-verison: 
    description: NodeJS version to use
    default: 20.x
    required: true
  working-dir:
    description: Working directory of application
    default: .
    required: false

runs: 
  using: composite
  steps:
    - name: setup NodeJS version {{ inputs.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{inputs.node-version}}
    - name: Cache dependencies
      id: cache
      uses: actions/cache@v3
      with: 
        path: ${{ inputs.working-dir }}/node_modules
        key: node-module-${{hashFiles('$({inputs.working-dir})/package-lock.json')}}
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash
      working-directory: ${{ inputs.working-dir }}